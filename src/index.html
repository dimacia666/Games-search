<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brand</title>
</head>
<body>
    <header>
        <div class="header">
            <div class="header-container">
                <a href="" class="logo">Logo</a>
                <svg class="icon">
                    <use href="./assets/svg/icon.svg#button-search"></use>
                </svg>
            </div>
        </div>
    </header>
    <main>
<section class="hero">
    <a href="/">
        <img class="baner" alt="Banner">

</section>
<section class="games-winer">

</section>
<section class="filters">

    <div class="filters-right">
        <button class="nav-btn">
            <svg class="nav-chevron" width="16" height="16">
                <use href="./assets/svg/icon.svg#chevron-left"></use>
            </svg>
        </button>

        <button class="nav-btn">
            <svg class="nav-chevron" width="16" height="16">
                <use href="./assets/svg/icon.svg#chevron-right"></use>
            </svg>
        </button>

        <button class="show-all-btn">Show all</button>
    </div>
</section>
    </main>
